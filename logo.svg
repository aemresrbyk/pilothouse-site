      <stop offset="0" stop-color="#1B1F2A"/>
      <stop offset="1" stop-color="#0A0C11"/>
    </linearGradient>
    <linearGradient id="phAccent" gradientUnits="userSpaceOnUse" x1="200" y1="200" x2="824" y2="824">
      <stop offset="0" stop-color="#FFA270"/>
      <stop offset="1" stop-color="#D9572B"/>
    </linearGradient>
  </defs>
  <!-- macOS-style squircle tile with standard 100px safe margin -->
