<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Pilothouse: a heading marker inside a bearing ring, open at north. Two colours, no gradients. -->
  <!-- Tile with the standard 100px macOS icon margin -->
  <rect x="100" y="100" width="824" height="824" rx="200" fill="#0B0D10"/>
  <rect x="102" y="102" width="820" height="820" rx="198" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4"/>
  <!-- Bearing ring with a gap at north -->
  <path d="M575.9 289 A232 232 0 1 1 448.1 289" fill="none" stroke="#E8EDF0" stroke-width="26" stroke-linecap="round"/>
  <!-- Heading marker -->
  <path d="M512 296 L616 640 L512 584 L408 640 Z" fill="#C8FF2E" stroke="#C8FF2E" stroke-width="12" stroke-linejoin="round"/>
</svg>
